name: Build Access NFC Lab APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project and configure Java 17
        run: |
          unzip -q AccessNfcLab-Phone-Build.zip -d extracted
          cd extracted/AccessNfcLab

          python3 - <<'PY'
          from pathlib import Path

          app = Path("app")

          # Replace old Java 8 settings wherever they occur
          for p in app.rglob("*"):
              if p.is_file() and p.suffix in (".gradle", ".kts"):
                  s = p.read_text()
                  s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
                  s = s.replace("VERSION_1_8", "VERSION_17")
                  p.write_text(s)

          # Explicitly configure Java compilation
          groovy = app / "build.gradle"
          kotlin = app / "build.gradle.kts"

          if groovy.exists():
              with groovy.open("a") as f:
                  f.write("""
          
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """)
          elif kotlin.exists():
              with kotlin.open("a") as f:
                  f.write("""
          
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """)
          else:
              raise SystemExit("App Gradle build file not found")

          print("Java compatibility configured for version 17")
          PY

          echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AccessNfcLab-debug-apk
          path: extracted/AccessNfcLab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
