
      - name: Extract Android project
        run: |
          unzip -q AccessNfcLab-Phone-Build.zip -d extracted
          cd extracted/AccessNfcLab
          python3 - <<'PY'
          from pathlib import Path

          for name in ("build.gradle", "build.gradle.kts"):
              p = Path("app") / name
              if p.exists():
                  s = p.read_text()
                  s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
                  p.write_text(s)
                  print("Updated Java target in", p)
          PY
          echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
          
